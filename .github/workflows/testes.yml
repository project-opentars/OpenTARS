# openTARS 5.2: testes sem tela nos três sistemas (GitHub Actions).
# Vai em .github/workflows/testes.yml de um repositório que tenha a pasta app/ (= fonte/app) na raiz.
# Ainda NÃO está em nenhum repositório: onde o código vai é decisão do Enzo (PLANO_5.2.md, F1.4).
name: testes
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    defaults: {run: {working-directory: app}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Dependências do sistema
        run: sudo apt-get update && sudo apt-get install -y xvfb xclip libnotify-bin libglib2.0-bin python3-gi gir1.2-atspi-2.0 libegl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Dependências Python
        run: pip install requests psutil pyautogui pillow PySide6-Essentials numpy onnxruntime
      - name: Suíte inteira
        run: cd tests && xvfb-run -a python -u run_all.py

  portateis:
    # O que já deve funcionar fora do Linux. Cresce a cada fase (F5 Windows, F6 macOS).
    strategy:
      fail-fast: false
      matrix: {os: [windows-latest, macos-latest]}
    runs-on: ${{ matrix.os }}
    defaults: {run: {working-directory: app}}
    env: {QT_QPA_PLATFORM: offscreen, PYTHONUTF8: "1"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests psutil pillow PySide6-Essentials numpy onnxruntime
      - name: Camada de plataforma
        run: python tests/test_plataforma.py
      - name: Prova portátil (sem modelo)
        run: python tests/test_prova_portatil.py
      - name: Instância única (no Windows, TCP local com segredo)
        run: python tests/test_instancia_windows.py
      - name: Mini-shell dos comandos de bash do treino
        run: python tests/test_shell_portatil.py
      - name: Backend do Windows de verdade (no macOS, pula)
        run: python tests/test_plataforma_windows.py
      - name: Abrir e fechar programas, atalho global e clique pelo nome pelo núcleo
        run: |
          python tests/test_apps_outros_sistemas.py
          python tests/test_atalhos_outros_sistemas.py
          python tests/test_acessibilidade_outros_sistemas.py
      - name: O terminal (opentars -p, --chat, --diagnostico) como processo de verdade
        run: python tests/test_cli_portatil.py
      - name: Serviço dos Probes (trava e comando)
        run: python tests/test_probes_servico.py
      - name: Assistente (F4 e F3.5) e aviso de modelo novo
        run: |
          python tests/test_busca_arquivos.py
          python tests/test_fotos.py
          python tests/test_acoes_arquivos.py
          python tests/test_contexto.py
          python tests/test_qt_lancador.py
          python tests/test_qt_arquivos.py
          python tests/test_qt_primeiro_uso_sistema.py
          python tests/test_gerenciar_modelos.py
      - name: Assistente 5.3 (agenda, notas, e-mail, mídia, ações do sistema, voz, índice, terminal), sem modelo e sem rede
        run: |
          python tests/test_integracoes.py
          python tests/test_midia.py
          python tests/test_acoes_sistema_outros.py
          python tests/test_email.py
          python tests/test_busca_indice.py
          python tests/test_lembretes.py
          python tests/test_voz_pt.py
          python tests/test_terminal_visual.py
          python tests/test_tela_pela_acessibilidade.py
          python tests/test_voz_gemma.py
      - name: Módulos que não dependem do Linux importam
        run: python -c "import tars_plataforma, tars_prova, tars_i18n, tars_memoria, tars_rotinas, tars_historico, tars_confianca, tars_murph"
      - name: Motor llama.cpp (5.3) sem modelo
        run: python tests/test_motor_local.py
      - name: Motor llama.cpp de verdade (baixa o llama-server e o Lite)
        env: {TARS_MOTOR_REAL: "1"}
        run: python tests/test_motor_real.py

  janelas:
    # as janelas de verdade (sem tela) no Windows e no macOS, com um Ollama de mentira: o primeiro uso de ponta a ponta, a
    # principal, os cliques, os modos, a barra rápida, as ações, os Probes e as rotinas. Pegaria o passo 4 do Windows.
    strategy:
      fail-fast: false
      matrix: {os: [windows-latest, macos-latest]}
    runs-on: ${{ matrix.os }}
    defaults: {run: {working-directory: app}}
    env: {QT_QPA_PLATFORM: offscreen, PYTHONUTF8: "1"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests psutil pyautogui pillow PySide6-Essentials numpy onnxruntime
      - name: Janelas
        run: >
          python tests/run_all.py test_primeiro_uso test_qt_primeiro_uso test_qt_primeiro_uso_gargantua2 test_nuvem_login
          test_qt_principal test_qt_cliques test_qt_modos test_qt_barra_rapida test_qt_acoes test_qt_probes test_qt_rotinas
          test_qt_codigo test_qt_imagem test_qt_mascote test_qt_atualizacao test_mais_modelos test_qt_download_grande

  app_importa:
    # Mostra o que ainda impede o app inteiro de carregar no Windows e no macOS (fcntl, AT-SPI, X...).
    # Pode falhar até as fases F5/F6: serve de lista de tarefas, não de trava.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix: {os: [windows-latest, macos-latest]}
    runs-on: ${{ matrix.os }}
    defaults: {run: {working-directory: app}}
    env: {QT_QPA_PLATFORM: offscreen, PYTHONUTF8: "1", TARS_SEM_ASSISTENTE: "1"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests psutil pyautogui pillow PySide6-Essentials numpy onnxruntime
      - run: python -c "import tars"

  instalador_outros_linux:
    # o instalar.sh de ponta a ponta em contêineres (sem Ollama): pacotes do sistema, usuário comum, AT-SPI, diagnóstico,
    # alguns testes, a janela Qt de verdade num X virtual e a remoção
    strategy:
      fail-fast: false
      matrix: {imagem: ["fedora:latest", "archlinux:latest", "opensuse/tumbleweed:latest"]}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Instalar e conferir no contêiner
        run: docker run --rm -v "$PWD/app:/fonte:ro" ${{ matrix.imagem }} bash /fonte/empacotamento/linux/testar_conteiner.sh

  pacote_windows:
    # 14/11: o app pronto do Windows (Python, Qt e o llama-server dentro), no setup.exe do Inno Setup. Monta, instala em
    # silêncio como o app faz na atualização, confere o comando, o motor e a janela, instala por cima (atualização), passa
    # pelo instalar.ps1 apontado para os arquivos daqui e desinstala.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Montar o pacote (Python portátil, dependências, app e motor)
        run: python app/empacotamento/montar_pacote.py --saida dist/pacote
      - name: Compilar o setup.exe
        shell: powershell
        run: |
          choco install innosetup -y --no-progress
          $v = (Select-String -Path app\tars.py -Pattern '^VERSAO = "(.+)"').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DVersao=$v "/DPacote=$PWD\dist\pacote\openTARS" app\empacotamento\windows\opentars.iss
          if (-not (Test-Path app\dist\opentars-setup.exe)) { throw "o setup não saiu" }
          (Get-Item app\dist\opentars-setup.exe).Length / 1MB
      - uses: actions/upload-artifact@v4
        with: { name: opentars-setup, path: app/dist/opentars-setup.exe }
      - name: Instalar em silêncio e conferir
        shell: powershell
        run: |
          $p = Start-Process app\dist\opentars-setup.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "setup saiu com $($p.ExitCode)" }
          $raiz = "$env:LOCALAPPDATA\Programs\openTARS"
          foreach ($f in "runtime\python.exe", "runtime\pythonw.exe", "app\tars.py", "app\.empacotado", "bin\opentars.cmd", "unins000.exe") {
            if (-not (Test-Path "$raiz\$f")) { throw "falta $f" }
          }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\openTARS.lnk")) { throw "sem atalho" }
          $u = [Environment]::GetEnvironmentVariable("Path", "User")
          if (($u -split ";") -notcontains "$raiz\bin") { throw "opentars não está no PATH do usuário" }
          & "$raiz\bin\opentars.cmd" --version
          if ($LASTEXITCODE -ne 0) { throw "opentars --version falhou" }
          & "$raiz\bin\opentars.cmd" --diagnostico
          if (-not (Test-Path "$env:USERPROFILE\opentars-autoteste.txt")) { throw "sem relatório do diagnóstico" }
          $s = Get-ChildItem -Recurse "$raiz\app\motor-embutido" -Filter llama-server.exe
          if ($s.Count -lt 2) { throw "o motor embutido (Vulkan e CPU) não está no pacote" }
          & ($s | Where-Object { $_.FullName -like "*\cpu\*" } | Select-Object -First 1).FullName --version
          $env:QT_QPA_PLATFORM = "offscreen"
          Push-Location "$raiz\app"
          & "$raiz\runtime\python.exe" -c "import tars_qt.principal, tars_qt.atalhos_windows, uiautomation, tars_motor_local as m; b = m.binario(); print('motor:', b); assert b and 'motor-embutido' in str(b)"
          if ($LASTEXITCODE -ne 0) { throw "o app empacotado não carrega" }
          & "$raiz\runtime\python.exe" -c "import tars_atualizacao as a; assert a.empacotado() and not a.pelo_script(); print('atualização pelo pacote')"
          if ($LASTEXITCODE -ne 0) { throw "o app não se reconhece como empacotado" }
          Pop-Location
      - name: Instalar por cima (como a atualização do app, com /REABRIR=1)
        shell: powershell
        run: |
          $p = Start-Process app\dist\opentars-setup.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/REABRIR=1" -PassThru
          $p.WaitForExit()
          if ($p.ExitCode -ne 0) { throw "setup por cima saiu com $($p.ExitCode)" }
          Start-Sleep 8
          $abertos = Get-Process pythonw -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$env:LOCALAPPDATA\Programs\openTARS\*" }
          if (-not $abertos) { throw "o app não reabriu depois da atualização" }
          $abertos | Stop-Process -Force
      - name: O instalar.ps1 (irm | iex) com os arquivos daqui
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force rel | Out-Null
          Copy-Item app\dist\opentars-setup.exe rel\
          $h = (Get-FileHash -Algorithm SHA256 rel\opentars-setup.exe).Hash.ToLower()
          Set-Content -Encoding ascii rel\SHA256SUMS "$h  opentars-setup.exe"
          $env:OPENTARS_RELEASE = "file:///" + ((Resolve-Path rel).Path -replace "\\", "/")
          .\app\empacotamento\windows\instalar.ps1
          Start-Sleep 5
          Get-Process pythonw -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$env:LOCALAPPDATA\Programs\openTARS\*" } | Stop-Process -Force
      - name: Desinstalar
        shell: powershell
        run: |
          $u = (Get-ChildItem "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall" | Where-Object { $_.GetValue("DisplayName") -eq "openTARS" }).GetValue("UninstallString")
          $exe = ($u -replace '^"([^"]+)".*','$1')
          Start-Process $exe -ArgumentList "/VERYSILENT" -Wait
          Start-Sleep 3
          if (Test-Path "$env:LOCALAPPDATA\Programs\openTARS\app") { throw "não removeu" }

  pacote_macos:
    # 14/11: o openTARS.app pronto (Python, Qt e o llama-server com Metal ou CPU dentro), assinado ad-hoc, no .dmg.
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-latest, maquina: arm64}
          - {runner: macos-13, maquina: x86_64}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Montar o openTARS.app e o .dmg
        run: python3 app/empacotamento/montar_pacote.py --saida dist/pacote
      - uses: actions/upload-artifact@v4
        with: { name: "openTARS-macos-${{ matrix.maquina }}", path: "dist/pacote/openTARS-macos-${{ matrix.maquina }}.dmg" }
      - name: O instalar.sh (curl | bash) com os arquivos daqui
        run: |
          mkdir rel && cp dist/pacote/openTARS-macos-*.dmg rel/
          (cd rel && shasum -a 256 openTARS-macos-*.dmg > SHA256SUMS && cat SHA256SUMS)
          OPENTARS_RELEASE="file://$PWD/rel" bash app/empacotamento/macos/instalar.sh
          pkill -f "$HOME/Applications/openTARS.app/Contents/Resources/runtime" || true
      - name: Conferir o app instalado
        env: {QT_QPA_PLATFORM: offscreen}
        run: |
          A="$HOME/Applications/openTARS.app"
          codesign --verify --deep --strict "$A"
          test -x "$A/Contents/MacOS/openTARS" && test -f "$A/Contents/Resources/app/.empacotado"
          plutil -extract NSMicrophoneUsageDescription raw "$A/Contents/Info.plist"
          zsh -ic 'command -v opentars && opentars --version' | tee /tmp/zsh.txt
          grep -q "openTARS 5\." /tmp/zsh.txt
          ~/.local/bin/opentars --diagnostico || true
          test -f ~/opentars-autoteste.txt
          S="$(find "$A/Contents/Resources/app/motor-embutido" -name llama-server -type f | head -1)"
          test -n "$S" && "$S" --version
          cd "$A/Contents/Resources/app"
          ../runtime/bin/python3 -c "import tars_qt.principal, tars_motor_local as m; b = m.binario(); print('motor:', b); assert b and 'motor-embutido' in str(b)"
          ../runtime/bin/python3 -c "import tars_atualizacao as a; assert a.empacotado() and a.pacote_mac_atual().name == 'openTARS.app'; print('atualização pelo pacote')"
          ../runtime/bin/python3 "$GITHUB_WORKSPACE/app/tests/test_plataforma_macos.py"
      - name: Atualizar pelo .dmg (o caminho do botão Atualizar)
        run: |
          cd "$HOME/Applications/openTARS.app/Contents/Resources/app"
          ../runtime/bin/python3 -c "import tars_atualizacao as a, glob; print(a.instalar_dmg(glob.glob('$GITHUB_WORKSPACE/rel/*.dmg')[0]))"
          test -x "$HOME/Applications/openTARS.app/Contents/MacOS/openTARS" && test ! -e "$HOME/Applications/openTARS.app.velho"
      - name: Remover
        run: |
          bash app/empacotamento/macos/instalar.sh --remover
          test ! -e "$HOME/Applications/openTARS.app" && test ! -e ~/.local/bin/opentars

# openTARS 5.2: testes sem tela nos três sistemas (GitHub Actions).
# Vai em .github/workflows/testes.yml de um repositório que tenha a pasta app/ (= fonte/app) na raiz.
# Ainda NÃO está em nenhum repositório: onde o código vai é decisão do Enzo (PLANO_5.2.md, F1.4).
name: testes
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    defaults: {run: {working-directory: app}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Dependências do sistema
        run: sudo apt-get update && sudo apt-get install -y xvfb xclip libnotify-bin libglib2.0-bin python3-gi gir1.2-atspi-2.0 libegl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Dependências Python
        run: pip install requests psutil pyautogui pillow PySide6-Essentials numpy
      - name: Suíte inteira
        run: cd tests && xvfb-run -a python -u run_all.py

  portateis:
    # O que já deve funcionar fora do Linux. Cresce a cada fase (F5 Windows, F6 macOS).
    strategy:
      fail-fast: false
      matrix: {os: [windows-latest, macos-latest]}
    runs-on: ${{ matrix.os }}
    defaults: {run: {working-directory: app}}
    env: {QT_QPA_PLATFORM: offscreen, PYTHONUTF8: "1"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests psutil pillow PySide6-Essentials
      - name: Camada de plataforma
        run: python tests/test_plataforma.py
      - name: Prova portátil (sem modelo)
        run: python tests/test_prova_portatil.py
      - name: Instância única (no Windows, TCP local com segredo)
        run: python tests/test_instancia_windows.py
      - name: Mini-shell dos comandos de bash do treino
        run: python tests/test_shell_portatil.py
      - name: Backend do Windows de verdade (no macOS, pula)
        run: python tests/test_plataforma_windows.py
      - name: Módulos que não dependem do Linux importam
        run: python -c "import tars_plataforma, tars_prova, tars_i18n, tars_memoria, tars_rotinas, tars_historico, tars_confianca, tars_murph"

  app_importa:
    # Mostra o que ainda impede o app inteiro de carregar no Windows e no macOS (fcntl, AT-SPI, X...).
    # Pode falhar até as fases F5/F6: serve de lista de tarefas, não de trava.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix: {os: [windows-latest, macos-latest]}
    runs-on: ${{ matrix.os }}
    defaults: {run: {working-directory: app}}
    env: {QT_QPA_PLATFORM: offscreen, PYTHONUTF8: "1", TARS_SEM_ASSISTENTE: "1"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests psutil pyautogui pillow PySide6-Essentials
      - run: python -c "import tars"

  instalador_windows:
    # o instalar.ps1 de ponta a ponta com o código deste commit (sem baixar o Ollama), o app instalado e a remoção
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar
        shell: powershell
        run: .\app\empacotamento\windows\instalar.ps1 -Fonte app -SemOllama
      - name: Diagnóstico pelo comando instalado
        shell: powershell
        run: |
          & "$env:LOCALAPPDATA\openTARS\bin\opentars.cmd" --diagnostico
          if (-not (Test-Path "$env:USERPROFILE\opentars-autoteste.txt")) { throw "sem relatório" }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\openTARS.lnk")) { throw "sem atalho" }
          exit 0
      - name: Backend do Windows no Python instalado
        shell: powershell
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          & "$env:LOCALAPPDATA\openTARS\venv\Scripts\python.exe" app\tests\test_plataforma_windows.py
          & "$env:LOCALAPPDATA\openTARS\venv\Scripts\python.exe" -c "import sys; sys.path.insert(0, r'$env:LOCALAPPDATA\openTARS\app'); import tars_qt.atalhos_windows, tars_qt.principal; print('qt ok')"
      - name: Remover
        shell: powershell
        run: |
          .\app\empacotamento\windows\instalar.ps1 -Remover
          if (Test-Path "$env:LOCALAPPDATA\openTARS") { throw "não removeu" }

  instalador_macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar
        run: bash app/empacotamento/macos/instalar.sh --fonte app --sem-ollama
      - name: Diagnóstico pelo comando instalado e o app assinado
        run: |
          ~/.local/bin/opentars --diagnostico || true
          test -f ~/opentars-autoteste.txt
          test -x ~/Applications/openTARS.app/Contents/MacOS/openTARS
          codesign -v ~/Applications/openTARS.app
      - name: A janela carrega (sem tela)
        env: {QT_QPA_PLATFORM: offscreen}
        run: cd "$HOME/Library/Application Support/openTARS/app" && "../venv/bin/python3" -c "import tars_qt.principal; print('qt ok')"
      - name: Remover
        run: |
          bash app/empacotamento/macos/instalar.sh --remover
          test ! -e "$HOME/Library/Application Support/openTARS"
